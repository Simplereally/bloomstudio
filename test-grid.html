<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  width: 100vw;
  height: 100vh;
  background: black;
  padding: 20px;
  box-sizing: border-box;
  gap: 16px;
  place-content: center;
  place-items: center;
}
.cell {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  border: 1px dashed red;
}
.card {
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  border: 1px solid white;
}
</style>
</head>
<body>
<div class="container" id="container"></div>
<script>
function render(items) {
  const c = document.getElementById('container');
  c.innerHTML = '';
  
  const count = items.length;
  const cols = count <= 2 ? 2 : count <= 4 ? 2 : count <= 6 ? 3 : 4;
  const rows = Math.ceil(count / cols);
  
  c.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  c.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
  
  items.forEach(ar => {
    const isTall = ar < 1;
    const cell = document.createElement('div');
    cell.className = 'cell';
    
    const card = document.createElement('div');
    card.className = 'card';
    card.innerText = ar.toFixed(2);
    
    // CSS trick
    card.style.aspectRatio = ar;
    card.style.width = isTall ? 'auto' : '100%';
    card.style.height = isTall ? '100%' : 'auto';
    card.style.maxWidth = '100%';
    card.style.maxHeight = '100%';
    
    cell.appendChild(card);
    c.appendChild(cell);
  });
}
render([1, 16/9, 9/16, 4/3, 2/3]);
</script>
</body>
</html>
